name: Build, Test & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main app image (used by both web and bot services)
      - name: Extract metadata for app image
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for speciesnet image
        id: meta-speciesnet
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/speciesnet
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}

      - name: Build and push speciesnet image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./speciesnet.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-speciesnet.outputs.tags }}
          labels: ${{ steps.meta-speciesnet.outputs.labels }}

  test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TODO: Add your actual tests here
      - name: Run tests (placeholder)
        run: |
          echo "Running tests..."
          echo "TODO: Add Django tests, linting, etc."
          # Example commands you might use:
          # docker compose run --rm web python manage.py test
          # docker compose run --rm web python -m pytest
          echo "Tests passed! ✅"

  deploy:
    runs-on: self-hosted
    needs: [build-and-push, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker compose pull || true

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build
          
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 10
          docker compose ps

      - name: Cleanup old images
        run: |
          docker image prune -f
          docker container prune -f

      - name: Deployment status
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "Services running:"
          docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
