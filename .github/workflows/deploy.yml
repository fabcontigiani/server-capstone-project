name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pre-cleanup - Stop containers and fix permissions
        run: |
          cd ${{ github.workspace }} 2>/dev/null || true
          # Stop containers first
          docker compose down 2>/dev/null || true
          # Use Docker to fix file permissions (no sudo needed)
          if [ -d media ]; then
            docker run --rm -v "$(pwd)/media:/data" alpine:latest sh -c "chown -R $(id -u):$(id -g) /data" 2>/dev/null || true
          fi
        continue-on-error: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment file
        run: |
          cat <<EOF > .env
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=False
          DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}
          POSTGRES_DB=capstone_db
          POSTGRES_USER=capstone
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          GUNICORN_WORKERS=4
          UID=$(id -u)
          GID=$(id -g)
          EOF

      - name: Deploy with Docker Compose
        run: docker compose up -d --build --remove-orphans --wait
          
      - name: Cleanup old images
        run: docker image prune -f

      - name: Deployment status
        run: |
          echo "🚀 Deployment completed successfully!"
          docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
